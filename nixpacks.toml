# Configuración Railway: Python 3.11 + librerías para OpenCV/YOLO

[phases.setup]
nixPkgs = [
  "python311",
  "gcc",
  "pkg-config",
  "libGL",
  "libGLU",
  "glib",
  "stdenv.cc.cc.lib"
]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && pip uninstall -y opencv-python opencv-contrib-python || true",
  ". /opt/venv/bin/activate && pip install --force-reinstall opencv-python-headless==4.10.0.84"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHON_VERSION = "3.11"
