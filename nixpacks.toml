# Configuración Railway con Python 3.11 y librerías de sistema para OpenCV/YOLO

[phases.setup]
nixPkgs = [
  "python311",
  "gcc",
  "pkg-config",
  "libGL",
  "libGLU",
  "glib",
  "stdenv.cc.cc.lib"
]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHON_VERSION = "3.11"
LD_LIBRARY_PATH = "/nix/store/*-libGL-*/lib:/nix/store/*-glib-*/lib:$LD_LIBRARY_PATH"
